name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
      - name: Smoke-run the sample mission (single robot and team)
        run: |
          python -m walle run configs/sample_mission.yaml --out /tmp/run1 --quiet
          python -m walle run configs/sample_mission.yaml --robots 2 --out /tmp/run2 --quiet
          test -s /tmp/run1/report.md && test -s /tmp/run2/replay.html
